<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Order – Clark Performance</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="order">
  <div id="site-header"></div>

  <section class="section" style="min-height:50vh;">
    <div class="container" style="max-width:640px;" id="orderBox">
      <div class="skeleton" style="height:200px;"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="/js/site.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get('session_id');
    const box = document.getElementById('orderBox');

    async function poll(attempt) {
      if (!sessionId) {
        box.innerHTML = '<h1>No order found</h1><p>Missing session id in the link.</p>';
        return;
      }
      const res = await fetch('/api/order?session_id=' + encodeURIComponent(sessionId));
      if (res.status === 202 && attempt < 8) {
        box.innerHTML = '<h1>Processing payment...</h1><p class="lede">This usually takes just a few seconds. Please don\'t close this page.</p>';
        setTimeout(() => poll(attempt + 1), 2000);
        return;
      }
      if (!res.ok) {
        box.innerHTML = '<h1>Order not found</h1><p class="lede">Get in touch if you just paid and don\'t see your order.</p><a class="btn btn-outline-dark" href="/contact.html">Contact Me</a>';
        return;
      }
      const order = await res.json();
      const items = order.items || [];
      const purchasedOn = new Date(order.purchasedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      const email = order.customerEmail || 'your email';
      box.innerHTML = `
        <span class="eyebrow no-print">Thanks for your purchase!</span>
        <h1 class="no-print">${items.length > 1 ? `${items.length} programs purchased` : (items[0]?.programTitle || 'Order confirmed')}</h1>
        <p class="lede no-print">Payment received. Your answers are used to match the program to your training needs — your finished program will be sent to <strong>${email}</strong> within 5–10 days.</p>

        <div class="receipt">
          <div class="receipt-head">
            <div>
              <div class="receipt-title">Receipt</div>
              <div class="receipt-sub">Clark Performance</div>
            </div>
            <div class="receipt-meta">
              <div><span>Order no.</span> ${order.orderNumber}</div>
              <div><span>Date of purchase</span> ${purchasedOn}</div>
            </div>
          </div>
          <div class="receipt-lines">
            ${items.map(it => `
              <div class="receipt-line">
                <span>${it.programTitle}</span>
                <span>${it.priceNok != null ? formatPrice(it.priceNok) : ''}</span>
              </div>
            `).join('')}
          </div>
          <div class="receipt-total"><span>Total paid</span><span>${formatPrice(order.totalNok)}</span></div>
          <div class="receipt-foot">Program will be sent to ${email} within 5–10 days.</div>
        </div>

        <p class="form-note no-print">${order.receiptEmailed ? `A copy of this receipt is also being sent to ${email}. ` : ''}Keep this page for your records — you can print it or save it as a PDF.</p>
        <div class="no-print" style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button>
          <a class="btn btn-outline-dark" href="/index.html">Back to Home</a>
        </div>
      `;
      clearCart();
    }
    poll(0);
  </script>
</body>
</html>
