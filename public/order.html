<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Order – Clark Performance</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="order">
  <div id="site-header"></div>

  <section class="section" style="min-height:50vh;">
    <div class="container" style="max-width:640px;" id="orderBox">
      <div class="skeleton" style="height:200px;"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="/js/site.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get('session_id');
    const box = document.getElementById('orderBox');

    async function poll(attempt) {
      if (!sessionId) {
        box.innerHTML = '<h1>No order found</h1><p>Missing session id in the link.</p>';
        return;
      }
      const res = await fetch('/api/order?session_id=' + encodeURIComponent(sessionId));
      if (res.status === 202 && attempt < 8) {
        box.innerHTML = '<h1>Processing payment...</h1><p class="lede">This usually takes just a few seconds. Please don\'t close this page.</p>';
        setTimeout(() => poll(attempt + 1), 2000);
        return;
      }
      if (!res.ok) {
        box.innerHTML = '<h1>Order not found</h1><p class="lede">Get in touch if you just paid and don\'t see your order.</p><a class="btn btn-outline-dark" href="/contact.html">Contact Me</a>';
        return;
      }
      const order = await res.json();
      const items = order.items || [];
      box.innerHTML = `
        <span class="eyebrow">Thanks for your purchase!</span>
        <h1>${items.length > 1 ? `${items.length} programs purchased` : (items[0]?.programTitle || 'Order confirmed')}</h1>
        <p class="lede">Your order is confirmed. Download your program PDF${items.length > 1 ? 's' : ''} below.</p>
        <div class="stack" style="margin:24px 0;">
          ${items.map(it => `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border:1px solid #E7E8EA;border-radius:4px;">
              <span style="font-weight:600;">${it.programTitle}</span>
              <a class="btn btn-primary" style="padding:10px 20px;" href="/api/download/${it.downloadToken}">Download PDF</a>
            </div>
          `).join('')}
        </div>
        <p class="form-note">A receipt has been sent to ${order.customerEmail || 'your email'}.</p>
      `;
      clearCart();
    }
    poll(0);
  </script>
</body>
</html>
