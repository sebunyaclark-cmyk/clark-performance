<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Cart – Clark Performance</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <section class="section" style="min-height:50vh;">
    <div class="container" style="max-width:760px;">
      <span class="eyebrow">Your Cart</span>
      <h1 style="margin-bottom:28px;">Cart</h1>
      <div id="cartBox"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="/js/site.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const box = document.getElementById('cartBox');

      if (!cart.length) {
        box.innerHTML = `
          <p class="lede" style="margin-bottom:24px;">Your cart is empty.</p>
          <a class="btn btn-primary" href="/programs.html">Browse Programs</a>
        `;
        return;
      }

      box.innerHTML = `
        <div class="stack" style="margin-bottom:28px;">
          ${cart.map(item => `
            <div style="display:flex;align-items:center;gap:16px;padding:14px;border:1px solid #E7E8EA;border-radius:4px;">
              <img src="${item.imagePath}" alt="" style="width:70px;height:70px;object-fit:cover;border-radius:4px;flex-shrink:0;" />
              <div style="flex:1;min-width:0;">
                <div style="font-weight:600;">${item.title}</div>
                <div class="price">${formatPrice(item.priceNok)}</div>
              </div>
              <button class="btn btn-outline-dark" style="padding:8px 16px;font-size:0.8rem;" data-remove="${item.id}">Remove</button>
            </div>
          `).join('')}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid #E7E8EA;padding-top:20px;margin-bottom:28px;">
          <span style="font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:1.1rem;">Total</span>
          <span class="price" style="font-size:1.6rem;">${formatPrice(cartTotal(cart))}</span>
        </div>

        <div class="intake-card" style="margin-bottom:24px;">
          <h3 style="margin-bottom:4px;">Tell me about yourself</h3>
          <p class="form-note" style="margin-top:0;margin-bottom:18px;">This helps me get your program right for you. Takes a minute.</p>
          <div class="form-field">
            <label>Years of experience (strength training, your sport, etc.)</label>
            <input id="intakeExperience" placeholder="e.g. 3 years of strength training, 8 years playing football" />
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div class="form-field"><label>Position</label><input id="intakePosition" placeholder="e.g. Central midfielder" /></div>
            <div class="form-field"><label>Age</label><input type="number" min="1" max="100" id="intakeAge" /></div>
          </div>
          <div class="form-field"><label>Your strengths</label><textarea id="intakeStrengths" style="min-height:70px;" placeholder="What are you already good at?"></textarea></div>
          <div class="form-field"><label>Your weaknesses</label><textarea id="intakeWeaknesses" style="min-height:70px;" placeholder="What do you struggle with?"></textarea></div>
          <div class="form-field"><label>What do you want to develop?</label><textarea id="intakeGoals" style="min-height:70px;" placeholder="e.g. First step speed, vertical jump, in-season durability..."></textarea></div>
          <div class="form-field"><label>Anything else relevant</label><textarea id="intakeNotes" style="min-height:100px;" placeholder="Injuries, equipment access, schedule constraints, anything else I should know"></textarea></div>
          <p class="form-note" id="intakeError" style="color:#B42318;"></p>
        </div>

        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button class="btn btn-primary" style="flex:1;min-width:200px;" id="checkoutBtn">Continue to Payment</button>
          <a class="btn btn-outline-dark" href="/programs.html">Add More Programs</a>
        </div>
        <p class="form-note" id="checkoutNote"></p>
      `;

      box.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          removeFromCart(btn.dataset.remove);
          renderCart();
        });
      });

      document.getElementById('checkoutBtn').addEventListener('click', async () => {
        const btn = document.getElementById('checkoutBtn');
        const errorEl = document.getElementById('intakeError');
        const intake = {
          experience: document.getElementById('intakeExperience').value.trim(),
          position: document.getElementById('intakePosition').value.trim(),
          age: document.getElementById('intakeAge').value.trim(),
          strengths: document.getElementById('intakeStrengths').value.trim(),
          weaknesses: document.getElementById('intakeWeaknesses').value.trim(),
          goals: document.getElementById('intakeGoals').value.trim(),
          notes: document.getElementById('intakeNotes').value.trim(),
        };
        const required = ['experience', 'position', 'age', 'strengths', 'weaknesses', 'goals'];
        if (required.some(key => !intake[key])) {
          errorEl.textContent = 'Please fill in all fields above (notes is optional) before continuing to payment.';
          document.getElementById('intakeExperience').closest('.intake-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        errorEl.textContent = '';
        btn.disabled = true;
        btn.textContent = 'Loading...';
        try {
          const res = await fetch('/api/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ programIds: getCart().map(item => item.id), intake }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Something went wrong');
          window.location.href = data.url;
        } catch (e) {
          btn.disabled = false;
          btn.textContent = 'Continue to Payment';
          document.getElementById('checkoutNote').innerHTML = `<span style="color:#B42318;">${e.message}.</span>`;
        }
      });
    }
    renderCart();
  </script>
</body>
</html>
