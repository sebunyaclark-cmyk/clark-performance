<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Cart – Clark Performance</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <section class="section" style="min-height:50vh;">
    <div class="container" style="max-width:760px;">
      <span class="eyebrow">Your Cart</span>
      <h1 style="margin-bottom:28px;">Cart</h1>
      <div id="cartBox"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="/js/site.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const box = document.getElementById('cartBox');

      if (!cart.length) {
        box.innerHTML = `
          <p class="lede" style="margin-bottom:24px;">Your cart is empty.</p>
          <a class="btn btn-primary" href="/programs">Browse Programs</a>
        `;
        return;
      }

      // Each program carries its own filled-in form (filled in on the program page).
      const incomplete = cart.filter(item => !item.intake || !item.intake.deliveryEmail);

      box.innerHTML = `
        <div class="stack" style="margin-bottom:28px;">
          ${cart.map(item => `
            <div style="display:flex;align-items:center;gap:16px;padding:14px;border:1px solid #E7E8EA;border-radius:4px;">
              <img src="${item.imagePath}" alt="" style="width:70px;height:70px;object-fit:cover;border-radius:4px;flex-shrink:0;" />
              <div style="flex:1;min-width:0;">
                <div style="font-weight:600;">${item.title}</div>
                <div class="price">${formatPrice(item.priceNok)}</div>
                ${item.intake && item.intake.deliveryEmail
                  ? `<div class="form-note" style="margin:4px 0 0;">Answers filled in · sent to ${escapeText(item.intake.deliveryEmail)} · <a href="/program?id=${encodeURIComponent(item.id)}" style="color:var(--blue);text-decoration:underline;">edit</a></div>`
                  : `<div class="form-note" style="margin:4px 0 0;color:#B42318;">Missing your details · <a href="/program?id=${encodeURIComponent(item.id)}" style="color:#B42318;text-decoration:underline;">fill in the form</a></div>`}
              </div>
              <button class="btn btn-outline-dark" style="padding:8px 16px;font-size:0.8rem;" data-remove="${item.id}">Remove</button>
            </div>
          `).join('')}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid #E7E8EA;padding-top:20px;margin-bottom:28px;">
          <span style="font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;font-size:1.1rem;">Total</span>
          <span class="price" style="font-size:1.6rem;">${formatPrice(cartTotal(cart))}</span>
        </div>

        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button class="btn btn-primary" style="flex:1;min-width:200px;" id="checkoutBtn" ${incomplete.length ? 'disabled' : ''}>Continue to Payment</button>
          <a class="btn btn-outline-dark" href="/programs">Add More Programs</a>
        </div>
        <p class="form-note" id="checkoutNote">${incomplete.length
          ? '<span style="color:#B42318;">Open each program marked "Missing your details" and fill in the short form about you, then come back here.</span>'
          : 'Each program uses the answers you filled in on its own page. Your programs will be sent to your email within 2–10 days.'}</p>
      `;

      box.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          removeFromCart(btn.dataset.remove);
          renderCart();
        });
      });

      document.getElementById('checkoutBtn').addEventListener('click', async () => {
        const btn = document.getElementById('checkoutBtn');
        btn.disabled = true;
        btn.textContent = 'Loading...';
        try {
          const res = await fetch('/api/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: getCart().map(item => ({ programId: item.id, intake: item.intake })) }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Something went wrong');
          window.location.href = data.url;
        } catch (e) {
          btn.disabled = false;
          btn.textContent = 'Continue to Payment';
          document.getElementById('checkoutNote').innerHTML = `<span style="color:#B42318;">${escapeText(e.message)}.</span>`;
        }
      });
    }
    function escapeText(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    renderCart();
  </script>
</body>
</html>
